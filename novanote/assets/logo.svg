<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C5878"/>
      <stop offset="52%" stop-color="#3A6E93"/>
      <stop offset="100%" stop-color="#4A83A9"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#7FB6D9" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7FB6D9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7FB6D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#EDE4D6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3B183"/>
      <stop offset="100%" stop-color="#C77E43"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2B87C"/>
      <stop offset="55%" stop-color="#DC8F51"/>
      <stop offset="100%" stop-color="#C2703A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C82A8"/>
      <stop offset="100%" stop-color="#3A6E93"/>
    </linearGradient>
    <linearGradient id="rule2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC8F51"/>
      <stop offset="100%" stop-color="#E8A76B"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#badge)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
  <rect x="30" y="30" width="452" height="452" rx="104" fill="none" stroke="#A9CFE6" stroke-opacity="0.28" stroke-width="3"/>

  <!-- subtle dot grid -->
  <g fill="#BFDCEF" fill-opacity="0.16">
    <circle cx="96" cy="112" r="5"/><circle cx="152" cy="112" r="5"/>
    <circle cx="96" cy="168" r="5"/><circle cx="152" cy="168" r="5"/>
  </g>

  <!-- page -->
  <g>
    <path d="M150 118 H322 L392 188 V366 a34 34 0 0 1 -34 34 H150 a34 34 0 0 1 -34 -34 V152 a34 34 0 0 1 34 -34 Z"
          fill="url(#paper)"/>
    <path d="M322 118 L392 188 H346 a24 24 0 0 1 -24 -24 Z" fill="url(#fold)"/>
    <path d="M322 118 L392 188" stroke="#B8794A" stroke-opacity="0.35" stroke-width="3" fill="none"/>

    <!-- text rules -->
    <g stroke-linecap="round" fill="none">
      <path d="M160 216 H300" stroke="url(#rule)" stroke-width="20"/>
      <path d="M160 274 H352" stroke="#8FA6B8" stroke-opacity="0.62" stroke-width="16"/>
      <path d="M160 322 H320" stroke="#8FA6B8" stroke-opacity="0.62" stroke-width="16"/>
      <path d="M160 366 H262" stroke="url(#rule2)" stroke-width="16"/>
    </g>
  </g>

  <!-- nova spark -->
  <g transform="translate(392 132)">
    <path d="M0 -96 C10 -34 30 -14 92 0 C30 14 10 34 0 96 C-10 34 -30 14 -92 0 C-30 -14 -10 -34 0 -96 Z"
          fill="url(#star)"/>
    <path d="M0 -96 C10 -34 30 -14 92 0 C30 14 10 34 0 96 C-10 34 -30 14 -92 0 C-30 -14 -10 -34 0 -96 Z"
          fill="#FFFFFF" fill-opacity="0.22" transform="scale(0.42)"/>
    <circle cx="-52" cy="-58" r="9" fill="#F3C795" fill-opacity="0.9"/>
    <circle cx="58" cy="60" r="6.5" fill="#F3C795" fill-opacity="0.72"/>
  </g>
</svg>
